<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanner Day Scalp</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scalp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#14202b">

<style>
:root{color-scheme:light dark;--bg:#f3f5f7;--card:#fff;--tx:#14202b;--mut:#5d6b78;--ln:#dde3e8;--up:#0a8f6a;--dn:#c8344f;--wait:#7a8794;--upbg:#dcf4ec;--dnbg:#fbe1e6;--waitbg:#e8ecef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151c;--card:#162029;--tx:#e6edf3;--mut:#93a1ae;--ln:#26333f;--up:#2fd3a0;--dn:#ff6b86;--wait:#93a1ae;--upbg:#12372e;--dnbg:#3d1a24;--waitbg:#222e38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,button,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 12px}
button.go{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600;flex:1}
button:disabled{opacity:.5}
label.f{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}
input[type=number]{width:84px}
#st{font-size:13px;color:var(--mut);margin:6px 0 12px;min-height:20px}
.card{background:var(--card);border:1px solid var(--ln);border-left-width:5px;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.up{border-left-color:var(--up)}.card.dn{border-left-color:var(--dn)}.card.wt{border-left-color:var(--wait)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sym{font-weight:700;font-size:18px}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px}
.up .chip{background:var(--upbg);color:var(--up)}.dn .chip{background:var(--dnbg);color:var(--dn)}.wt .chip{background:var(--waitbg);color:var(--wait)}
.px{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin:4px 0 8px}
.meter{height:6px;background:var(--ln);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--wait)}
.up .meter i{background:var(--up)}.dn .meter i{background:var(--dn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;font-size:14px}
.grid span{color:var(--mut)}.grid b{float:right;font-weight:600}
.warn{color:var(--dn)}
.note{font-size:12.5px;color:var(--mut);margin-top:16px}
a.more{display:block;text-align:center;margin:6px 0;color:var(--mut);font-size:14px;background:none;border:0;width:100%}
</style>
</head>
<body>
<main>
<h1>Scanner Day Scalp</h1>
<p class="sub">Top 5 criptos por tendência, estrutura e volume (Binance Futures USDT).</p>

<div class="bar">
  <select id="tf" aria-label="Tempo gráfico"><option value="5m">5m</option><option value="15m" selected>15m</option></select>
  <select id="uni" aria-label="Pares analisados"><option value="30">30 pares</option><option value="60" selected>60 pares</option><option value="100">100 pares</option></select>
  <label class="f">Liq. mín. 1h (M$)<input id="liq" type="number" value="5" min="0" step="1"></label>
  <label class="f"><input id="auto" type="checkbox"> Atualizar a cada 5 min</label>
  <button class="go" id="run">Escanear</button>
</div>
<div id="st" role="status"></div>
<div id="out"></div>
<p class="note">Usa só candles fechados. A variação de 24h não entra no cálculo. Confirme liquidez, spread e volume no par da sua corretora. Não é recomendação de investimento.</p>
</main>

<script>
const BASE="https://fapi.binance.com";
const $=id=>document.getElementById(id);
let timer=null,showAll=false,rows=[];

async function api(path,params){
  const u=BASE+path+"?"+new URLSearchParams(params);
  const r=await fetch(u);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function klines(sym,iv){
  const raw=await api("/fapi/v1/klines",{symbol:sym,interval:iv,limit:300});
  raw.pop(); // descarta candle aberto
  return raw.map(k=>({t:k[0],h:+k[2],l:+k[3],c:+k[4],v:+k[5],qv:+k[7]}));
}
function ema(a,n){const k=2/(n+1);let e=a[0];const o=[e];for(let i=1;i<a.length;i++){e=a[i]*k+e*(1-k);o.push(e)}return o}
function atr(d,n=14){
  const tr=d.map((x,i)=>i?Math.max(x.h-x.l,Math.abs(x.h-d[i-1].c),Math.abs(x.l-d[i-1].c)):x.h-x.l);
  return tr.slice(-n).reduce((a,b)=>a+b,0)/n;
}
function vwapDia(d){
  const day=new Date(d[d.length-1].t).toISOString().slice(0,10);
  let pv=0,vv=0;
  for(const x of d){if(new Date(x.t).toISOString().slice(0,10)===day){pv+=(x.h+x.l+x.c)/3*x.v;vv+=x.v}}
  return pv/vv;
}
const mx=a=>Math.max(...a),mn=a=>Math.min(...a);
